<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#3fa07e"/>
      <stop offset="1" stop-color="#21705a"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf3e4"/>
      <stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b3326" flood-opacity=".4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b3326" flood-opacity=".25"/>
    </filter>
    <style>
      .han { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .pin { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <text class="han" x="512" y="500" font-size="800" fill="#ffffff" fill-opacity=".06">说</text>
  <g fill="#f6cf7f" fill-opacity=".85"><circle cx="90" cy="120" r="8"/><circle cx="950" cy="560" r="7"/><circle cx="80" cy="980" r="6"/></g>
  <g fill="#ffffff" fill-opacity=".45"><circle cx="960" cy="60" r="6"/><circle cx="70" cy="470" r="5"/><circle cx="960" cy="980" r="5"/></g>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M 296 96 L 868 96 Q 928 96 928 156 L 928 382 Q 928 442 868 442 L 452 442 L 330 528 L 356 442 L 296 442 Q 236 442 236 382 L 236 156 Q 236 96 296 96 Z" fill="#e9dfcc"/>
    <path d="M 296 96 L 868 96 Q 928 96 928 156 L 928 362 Q 928 422 868 422 L 452 422 L 330 508 L 356 422 L 296 422 Q 236 422 236 362 L 236 156 Q 236 96 296 96 Z" fill="#fbf3e4"/>
  </g>
  <text class="han" x="582" y="228" font-size="170" fill="#1d1c1a">你好</text>
  <text class="pin" x="582" y="356" font-size="44" fill="#21705a">nǐ hǎo</text>

  <!-- microphone -->
  <g filter="url(#shadow)">
    <rect x="206" y="556" width="188" height="290" rx="94" fill="url(#mic)"/>
  </g>
  <g stroke="#c9bda6" stroke-width="10" stroke-linecap="round">
    <line x1="246" y1="626" x2="354" y2="626"/>
    <line x1="236" y1="666" x2="364" y2="666"/>
    <line x1="236" y1="706" x2="364" y2="706"/>
    <line x1="246" y1="746" x2="354" y2="746"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" filter="url(#soft)">
    <path d="M 160 730 A 140 140 0 0 0 440 730"/>
    <line x1="300" y1="870" x2="300" y2="930"/>
    <line x1="220" y1="940" x2="380" y2="940"/>
  </g>

  <!-- voice -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <path d="M 470 616 A 200 200 0 0 1 470 784" stroke-opacity=".9"/>
    <path d="M 530 576 A 270 270 0 0 1 530 824" stroke-opacity=".6"/>
    <path d="M 590 536 A 340 340 0 0 1 590 864" stroke-opacity=".3"/>
  </g>
  <g fill="#f6cf7f">
    <rect x="660" y="672" width="16" height="56" rx="8"/>
    <rect x="688" y="642" width="16" height="116" rx="8"/>
    <rect x="716" y="610" width="16" height="180" rx="8"/>
    <rect x="744" y="650" width="16" height="100" rx="8"/>
    <rect x="772" y="590" width="16" height="220" rx="8"/>
    <rect x="800" y="628" width="16" height="144" rx="8"/>
    <rect x="828" y="660" width="16" height="80" rx="8"/>
    <rect x="856" y="636" width="16" height="128" rx="8"/>
    <rect x="884" y="676" width="16" height="48" rx="8"/>
  </g>

  <!-- recognized -->
  <g filter="url(#shadow)">
    <rect x="560" y="846" width="368" height="118" rx="59" fill="#d29b3e"/>
    <rect x="560" y="846" width="368" height="104" rx="52" fill="#f6cf7f"/>
  </g>
  <circle cx="620" cy="898" r="38" fill="#21705a"/>
  <path d="M 602 898 L 615 912 L 640 884" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="han" x="772" y="898" font-size="76" fill="#7a3a12">你好</text>
</svg>
