  <!-- sun -->
  <g transform="translate(712 820)">
    <g stroke="#e9a93a" stroke-width="13" stroke-linecap="round">
      <path d="M 0 -96 L 0 -76 M 0 76 L 0 96 M -96 0 L -76 0 M 76 0 L 96 0 M -68 -68 L -54 -54 M 54 54 L 68 68 M -68 68 L -54 54 M 54 -54 L 68 -68"/>
    </g>
    <circle r="54" fill="#f2bf4c"/>
