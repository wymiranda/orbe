  <!-- the chosen picture -->
  <rect x="528" y="392" width="368" height="248" rx="40" fill="none" stroke="#2e7d5b" stroke-width="9"/>
  <g transform="translate(870 418)" filter="url(#soft)">
    <circle r="40" fill="#2e7d5b"/>
    <path d="M -18 0 L -5 14 L 20 -14" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
