<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#cd9741"/>
      <stop offset="1" stop-color="#a5722a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4a2d08" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4a2d08" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <text x="512" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="640" font-weight="700" fill="#ffffff" fill-opacity=".06">Aa</text>
  <g fill="#fbf3e4" fill-opacity=".55">
    <circle cx="140" cy="160" r="8"/><circle cx="900" cy="190" r="7"/><circle cx="110" cy="930" r="6"/><circle cx="930" cy="900" r="6"/>
  </g>

  <!-- the word -->
  <g filter="url(#shadow)">
    <rect x="352" y="70" width="320" height="270" rx="40" fill="#e3d2b1"/>
    <rect x="352" y="70" width="320" height="246" rx="40" fill="#ffffff"/>
  </g>
  <text x="512" y="222" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="700" letter-spacing="-4" fill="#1d1c1a">cat</text>
  <text x="512" y="282" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#b7832f">/kæt/</text>

  <!-- four pictures -->
  <g filter="url(#soft)">
    <rect x="132" y="396" width="360" height="262" rx="36" fill="#e3d2b1"/>
    <rect x="132" y="396" width="360" height="240" rx="36" fill="#fbf3e4"/>
    <rect x="532" y="396" width="360" height="262" rx="36" fill="#e3d2b1"/>
    <rect x="532" y="396" width="360" height="240" rx="36" fill="#fbf3e4"/>
    <rect x="132" y="694" width="360" height="262" rx="36" fill="#e3d2b1"/>
    <rect x="132" y="694" width="360" height="240" rx="36" fill="#fbf3e4"/>
    <rect x="532" y="694" width="360" height="262" rx="36" fill="#e3d2b1"/>
    <rect x="532" y="694" width="360" height="240" rx="36" fill="#fbf3e4"/>
  </g>

  <!-- apple -->
  <g transform="translate(312 516)">
    <path d="M 0 -50 C -26 -70, -86 -62, -86 -4 C -86 52, -46 92, -18 86 C -8 84, 8 84, 18 86 C 46 92, 86 52, 86 -4 C 86 -62, 26 -70, 0 -50 Z" fill="#c8372d"/>
    <path d="M -46 -22 C -50 -40, -36 -50, -24 -48" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="9" stroke-linecap="round"/>
    <path d="M 0 -50 C 0 -66, 4 -80, 12 -90" fill="none" stroke="#5b3a1a" stroke-width="9" stroke-linecap="round"/>
    <path d="M 12 -78 C 30 -100, 60 -96, 64 -86 C 52 -66, 28 -64, 12 -78 Z" fill="#2e7d5b"/>
  </g>

  <!-- cat: the right answer -->
  <g transform="translate(712 522)">
    <path d="M -84 -30 L -74 -104 L -24 -66 Z" fill="#e08a3c"/>
    <path d="M 84 -30 L 74 -104 L 24 -66 Z" fill="#e08a3c"/>
    <path d="M -66 -46 L -64 -84 L -38 -64 Z" fill="#f6c9a8"/>
    <path d="M 66 -46 L 64 -84 L 38 -64 Z" fill="#f6c9a8"/>
    <ellipse cx="0" cy="0" rx="96" ry="84" fill="#e08a3c"/>
    <path d="M -14 -82 L -8 -52 M 14 -82 L 8 -52 M 0 -84 L 0 -50" stroke="#c26d24" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="34" rx="50" ry="36" fill="#fbe6d2"/>
    <circle cx="-36" cy="-6" r="11" fill="#1d1c1a"/><circle cx="36" cy="-6" r="11" fill="#1d1c1a"/>
    <path d="M -10 16 L 10 16 L 0 28 Z" fill="#c8372d"/>
    <path d="M 0 28 Q -12 44 -24 38 M 0 28 Q 12 44 24 38" fill="none" stroke="#1d1c1a" stroke-width="5" stroke-linecap="round"/>
    <path d="M -54 22 L -112 12 M -54 34 L -110 40 M 54 22 L 112 12 M 54 34 L 110 40" stroke="#1d1c1a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- car -->
  <g transform="translate(312 822)">
    <path d="M -64 -14 L -40 -62 C -36 -70, -30 -74, -20 -74 L 36 -74 C 46 -74, 52 -70, 58 -62 L 84 -14 Z" fill="#2e7d5b"/>
    <path d="M -44 -18 L -28 -54 C -26 -58, -22 -60, -18 -60 L 2 -60 L 2 -18 Z M 14 -18 L 14 -60 L 34 -60 C 40 -60, 44 -58, 46 -54 L 66 -18 Z" fill="#cfe7f2"/>
    <rect x="-112" y="-20" width="224" height="64" rx="22" fill="#3c9a72"/>
    <rect x="-112" y="2" width="22" height="14" rx="6" fill="#f2bf4c"/>
    <rect x="94" y="2" width="18" height="14" rx="6" fill="#c8372d"/>
    <circle cx="-58" cy="46" r="28" fill="#1d1c1a"/><circle cx="-58" cy="46" r="11" fill="#d8c39c"/>
    <circle cx="58" cy="46" r="28" fill="#1d1c1a"/><circle cx="58" cy="46" r="11" fill="#d8c39c"/>
